<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout — Confronto direzioni</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #e9eaec; color: #2c2c2c; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .chrome {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 16px; background: #2b2b2b;
  }
  .chrome .brand { color: #fff; font-size: 13px; font-weight: 600; margin-right: 14px; }
  .chrome button {
    font: 500 12.5px/1 system-ui, sans-serif; padding: 7px 14px; cursor: pointer;
    background: transparent; color: #bbb; border: 0; border-radius: 5px;
  }
  .chrome button:hover { color: #fff; background: #3a3a3a; }
  .chrome button.on { color: #fff; background: #505050; }
  .pane { display: none; flex: 1; padding: 18px; gap: 18px; overflow: auto; }
  .pane.on { display: flex; }
  .frame-box { display: flex; flex-direction: column; gap: 6px; }
  .frame-box .flabel { font-size: 11px; font-weight: 600; color: #666; letter-spacing: 0.05em; text-transform: uppercase; }
  .frame-viewport { background: #fff; border: 1px solid #c9c9c9; border-radius: 6px; overflow: hidden; position: relative; }
  iframe { border: 0; display: block; transform-origin: top left; }

  /* desktop frame: 1280px wide content scaled to fit column */
  .desk .frame-viewport { width: 640px; height: 720px; }
  .desk iframe { width: 1280px; height: 1440px; transform: scale(0.5); }
  /* mobile frame: real 390x844 */
  .mob .frame-viewport { width: 390px; height: 720px; }
  .mob iframe { width: 390px; height: 720px; transform: scale(1); }
  /* side-by-side: all 3 at desktop width scaled to ~400px cols */
  .sbs .frame-box { flex: 1; min-width: 0; }
  .sbs .frame-viewport { width: 100%; height: 640px; }
  .sbs iframe { width: 1280px; height: 1400px; }
</style>
</head>
<body>

<nav class="chrome">
  <span class="brand">Scout — confronto direzioni</span>
  <button data-p="pa" class="on">A · Istituzionale</button>
  <button data-p="pb">B · Strumento chiaro</button>
  <button data-p="pc">C · Strumento di bordo</button>
  <button data-p="sbs">Affiancate</button>
</nav>

<div class="pane on" id="pa">
  <div class="frame-box desk"><span class="flabel">Desktop · A — Istituzionale</span><div class="frame-viewport"><iframe src="a-istituzionale.html"></iframe></div></div>
  <div class="frame-box mob"><span class="flabel">Mobile 390 · A</span><div class="frame-viewport"><iframe src="a-istituzionale.html"></iframe></div></div>
</div>

<div class="pane" id="pb">
  <div class="frame-box desk"><span class="flabel">Desktop · B — Strumento chiaro</span><div class="frame-viewport"><iframe src="b-strumento-chiaro.html"></iframe></div></div>
  <div class="frame-box mob"><span class="flabel">Mobile 390 · B</span><div class="frame-viewport"><iframe src="b-strumento-chiaro.html"></iframe></div></div>
</div>

<div class="pane" id="pc">
  <div class="frame-box desk"><span class="flabel">Desktop · C — Strumento di bordo</span><div class="frame-viewport"><iframe src="c-strumento-di-bordo.html"></iframe></div></div>
  <div class="frame-box mob"><span class="flabel">Mobile 390 · C</span><div class="frame-viewport"><iframe src="c-strumento-di-bordo.html"></iframe></div></div>
</div>

<div class="pane sbs" id="sbs">
  <div class="frame-box"><span class="flabel">A — Istituzionale</span><div class="frame-viewport"><iframe src="a-istituzionale.html" data-sbs></iframe></div></div>
  <div class="frame-box"><span class="flabel">B — Strumento chiaro</span><div class="frame-viewport"><iframe src="b-strumento-chiaro.html" data-sbs></iframe></div></div>
  <div class="frame-box"><span class="flabel">C — Strumento di bordo</span><div class="frame-viewport"><iframe src="c-strumento-di-bordo.html" data-sbs></iframe></div></div>
</div>

<script>
  const btns = document.querySelectorAll('.chrome button');
  const panes = document.querySelectorAll('.pane');
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.classList.remove('on'));
    panes.forEach(p => p.classList.remove('on'));
    b.classList.add('on');
    document.getElementById(b.dataset.p).classList.add('on');
  });
  // scale side-by-side iframes to their container
  function fitSbs() {
    document.querySelectorAll('iframe[data-sbs]').forEach(f => {
      const w = f.parentElement.clientWidth;
      f.style.transform = 'scale(' + (w / 1280) + ')';
    });
  }
  fitSbs();
  addEventListener('resize', fitSbs);
</script>
</body>
</html>
